<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="media-base-url" content="https://objectstorage.ap-singapore-1.oraclecloud.com/n/axyvokfa0tmo/b/aptis-media/o" />
    <title>Exam Centre · Aptis General</title>
    <script>
      (() => { const saved = localStorage.getItem("theme"), hour = new Date().getHours(); document.documentElement.classList.toggle("dark", saved === "dark" || (!saved && (matchMedia("(prefers-color-scheme: dark)").matches || hour >= 19 || hour < 7))); })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>tailwind.config = { darkMode: "class" };</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght,ital@6..72,500,0;6..72,700,0&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html.dark { color-scheme: dark; }
      body { min-height: 100dvh; -webkit-text-size-adjust: 100%; }
      button, a { touch-action: manipulation; }
      .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24; }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur dark:border-slate-800 dark:bg-slate-950/95" style="padding-top:max(12px, env(safe-area-inset-top))">
      <div class="mx-auto flex max-w-5xl items-center justify-between gap-3">
        <a href="english.html" class="grid size-11 place-items-center rounded-full text-indigo-900 hover:bg-indigo-50 dark:text-amber-300 dark:hover:bg-slate-800" aria-label="Back to lessons"><span class="material-symbols-outlined">arrow_back</span></a>
        <div class="min-w-0 text-center"><p class="text-xs font-bold uppercase tracking-[.18em] text-amber-700 dark:text-amber-300">Aptis ESOL General</p><h1 class="font-serif text-xl font-bold">Exam Centre</h1></div>
        <button id="theme-button" class="grid size-11 place-items-center rounded-full text-indigo-900 hover:bg-indigo-50 dark:text-amber-300 dark:hover:bg-slate-800" aria-label="Change theme"><span class="material-symbols-outlined">dark_mode</span></button>
      </div>
    </header>
    <p id="mock-sync-status" role="status" aria-live="polite" class="mx-auto max-w-5xl px-4 pt-3 text-sm text-slate-600 dark:text-slate-300"></p>
    <main id="app" class="mx-auto w-full max-w-5xl px-4 py-7 pb-12 sm:px-6"></main>
    <script src="/js/mock-store.js?v=1"></script>
    <script src="/js/mock-scoring.js?v=1"></script>
    <script src="/js/tests.js?v=13"></script>
  </body>
</html>
