<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Learning · APTIS B2 Prep</title>
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>tailwind.config={darkMode:'class'}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <style>
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
    .notebook-shell{
      position:relative;
      isolation:isolate;
      border:1px solid #d8c99f;
      border-left:10px solid #312e81;
      background-color:#fffdf4;
      background-image:
        radial-gradient(circle at 18px 22px,#b8aa82 0 3px,transparent 3.5px),
        repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(99,102,241,.09) 31px,rgba(99,102,241,.09) 32px);
      background-size:100% 32px,100% 32px;
      box-shadow:0 20px 45px rgba(67,56,32,.13),inset 0 1px 0 rgba(255,255,255,.85);
    }
    .notebook-shell::before{
      content:"";
      position:absolute;
      inset:0 auto 0 42px;
      width:1px;
      background:rgba(220,38,38,.2);
      z-index:0;
      pointer-events:none;
    }
    .notebook-shell>*{position:relative;z-index:1}
    .dark .notebook-shell{
      border-color:#475569;
      border-left-color:#fbbf24;
      background-color:#172033;
      background-image:
        radial-gradient(circle at 18px 22px,#64748b 0 3px,transparent 3.5px),
        repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(148,163,184,.1) 31px,rgba(148,163,184,.1) 32px);
      box-shadow:0 22px 50px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);
    }
    .dark .notebook-shell::before{background:rgba(251,113,133,.24)}
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 transition-colors dark:bg-slate-950 dark:text-slate-100">
  <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
      <a href="english.html" class="flex items-center gap-2 font-serif text-lg font-black text-indigo-950 dark:text-amber-300"><span class="material-symbols-outlined">school</span><span>APTIS B2</span></a>
      <div class="flex items-center gap-2">
        <a href="english.html" title="Welcome" aria-label="Welcome" class="grid size-10 place-items-center rounded-full text-indigo-900 hover:bg-indigo-50 dark:text-amber-300 dark:hover:bg-slate-800"><span class="material-symbols-outlined">home</span></a>
        <button id="theme-button" type="button" title="Change theme" aria-label="Change theme" class="grid size-10 place-items-center rounded-full text-indigo-900 hover:bg-indigo-50 dark:text-amber-300 dark:hover:bg-slate-800"><span class="material-symbols-outlined">dark_mode</span></button>
        <button id="logout-button" type="button" title="Log out" aria-label="Log out" class="grid size-10 place-items-center rounded-full text-slate-500 hover:bg-red-50 hover:text-red-700 dark:text-slate-400 dark:hover:bg-red-950/50 dark:hover:text-red-300"><span class="material-symbols-outlined">logout</span></button>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-5 py-8 md:py-12">
    <section class="relative overflow-hidden rounded-3xl bg-indigo-950 px-6 py-8 text-white shadow-xl md:px-10">
      <div class="absolute -right-16 -top-20 size-56 rounded-full bg-amber-300/20 blur-2xl"></div>
      <p class="text-xs font-bold uppercase tracking-[.2em] text-amber-300">My learning</p>
      <h1 id="page-title" class="mt-2 max-w-2xl font-serif text-3xl font-black md:text-4xl">Your dashboard</h1>
      <a href="english.html" class="mt-6 inline-flex items-center gap-2 rounded-full bg-amber-300 px-5 py-3 text-sm font-black text-slate-950 shadow-lg transition hover:-translate-y-0.5 hover:bg-amber-200"><span class="material-symbols-outlined">play_arrow</span><span>Continue</span></a>
    </section>
    <section class="mt-6 grid gap-4 md:grid-cols-2">
      <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="flex items-center gap-3"><span class="grid size-10 place-items-center rounded-xl bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-200"><span class="material-symbols-outlined">route</span></span><h2 class="font-bold">Progress</h2></div><div id="progress-list" class="mt-4"></div></article>
      <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div class="flex items-center gap-3"><span class="grid size-10 place-items-center rounded-xl bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200"><span class="material-symbols-outlined">task_alt</span></span><h2 class="font-bold">Submissions</h2></div><div id="submission-list" class="mt-4"></div></article>
    </section>
    <section class="notebook-shell mt-8 rounded-[1.75rem] py-7 pl-14 pr-5 sm:px-10 sm:pl-16 md:py-9">
      <div class="flex items-end justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-amber-700 dark:text-amber-300">Personal collection</p><h2 class="mt-1 font-serif text-3xl font-black text-indigo-950 dark:text-white">Vocabulary notebook</h2></div><div class="flex items-center gap-2"><span id="word-count" class="rounded-full bg-indigo-100 px-3 py-1 text-xs font-black text-indigo-800 dark:bg-indigo-950 dark:text-indigo-200"></span><button id="add-note-button" type="button" title="Add note" class="grid size-10 place-items-center rounded-full bg-indigo-950 text-white shadow-md dark:bg-amber-300 dark:text-slate-950"><span class="material-symbols-outlined">add</span></button></div></div>
      <form id="add-note-form" class="mt-5 hidden gap-3 rounded-2xl border border-indigo-100 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900 md:grid-cols-2"><label class="text-xs font-bold text-slate-600 dark:text-slate-300">Word<input id="new-word" required maxlength="100" autocomplete="off" class="mt-1 block w-full rounded-xl border-slate-300 bg-white text-slate-900 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"><span id="spelling-status" class="mt-1 block min-h-4 text-xs font-semibold"></span></label><label class="text-xs font-bold text-slate-600 dark:text-slate-300">Pronunciation<input id="new-phonetic" readonly maxlength="255" class="mt-1 block w-full rounded-xl border-slate-300 bg-slate-50 text-slate-900 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200"></label><label class="text-xs font-bold text-slate-600 dark:text-slate-300 md:col-span-2">Vietnamese meaning<textarea id="new-meaning" rows="2" maxlength="1000" class="mt-1 block w-full rounded-xl border-slate-300 bg-white text-slate-900 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"></textarea></label><label class="text-xs font-bold text-slate-600 dark:text-slate-300 md:col-span-2">Example<textarea id="new-example" rows="2" maxlength="2000" class="mt-1 block w-full rounded-xl border-slate-300 bg-white text-slate-900 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100"></textarea></label><div class="flex justify-end gap-2 md:col-span-2"><button id="cancel-note-button" type="button" title="Cancel" aria-label="Cancel" class="grid size-10 place-items-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"><span class="material-symbols-outlined">close</span></button><button type="submit" title="Save" aria-label="Save" class="grid size-10 place-items-center rounded-full bg-emerald-700 text-white hover:bg-emerald-800 dark:bg-emerald-400 dark:text-slate-950 dark:hover:bg-emerald-300"><span class="material-symbols-outlined">check</span></button></div></form>
      <div id="notebook-list" class="mt-5 grid gap-4 md:grid-cols-2"></div>
    </section>
    <p id="page-error" hidden class="mt-5 rounded-xl bg-red-50 p-4 text-sm font-semibold text-red-700 dark:bg-red-950/60 dark:text-red-200"></p>
  </main>
  <script src="js/dashboard.js?v=9"></script>
</body>
</html>
